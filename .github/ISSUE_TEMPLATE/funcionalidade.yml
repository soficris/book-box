name: Funcionalidade
description: Proponha uma nova funcionalidade ou melhoria para o Book Box
title: 'feat: '
labels: ['funcionalidade']
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual necessidade do usuário esta melhoria atende?
      description: Explique o problema ou a necessidade que motivou a sugestão.
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceitação
      description: Descreva como saberemos que a funcionalidade está concluída.
      placeholder: |
        - [ ] O usuário consegue...
        - [ ] O sistema apresenta...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - interface
        - biblioteca
        - catálogo de livros
        - documentação
        - configuração
    validations:
      required: true
