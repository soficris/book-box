name: Defeito
description: Relate um erro encontrado no Book Box
title: 'fix: '
labels: ['defeito']
body:
  - type: input
    id: versao
    attributes:
      label: Versão / ambiente
      description: Informe a versão ou descreva o ambiente em que encontrou o problema.
      placeholder: Ex.: versão 1.0.0, Android ou Windows
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      description: Descreva as etapas para encontrar o problema.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado x obtido
      description: Explique o que deveria acontecer e o que aconteceu.
    validations:
      required: true
